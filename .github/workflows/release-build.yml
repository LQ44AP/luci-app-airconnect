name: Build airconnect

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.sdk }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ========== 23.05 架构（主流，已 EOL） ==========
          - sdk: openwrt-23.05
            arch: aarch64_generic
          - sdk: openwrt-23.05
            arch: mips_24kc
          - sdk: openwrt-23.05
            arch: mipsel_24kc
          - sdk: openwrt-23.05
            arch: x86_64

          # ========== 25.12 架构（完整列表） ==========
          - sdk: openwrt-23.05
            arch: aarch64_generic
          - sdk: openwrt-23.05
            arch: mips_24kc
          - sdk: openwrt-23.05
            arch: mipsel_24kc
          - sdk: openwrt-23.05
            arch: x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Building packages
        uses: sbwml/openwrt-gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.sdk }}
          FEEDNAME: packages_ci
          PACKAGES: luci-app-airconnect airconnect
          NO_REFRESH_CHECK: true

      - name: Collect built packages
        run: |
          mkdir -p release_artifacts
          find bin/packages/ -type f \( -name '*.ipk' -o -name '*.apk' \) | while read f; do
            base=$(basename "$f")
            ext="${base##*.}"
            name="${base%.*}"
            if [[ "$ext" == "ipk" ]]; then
              # ipk 文件名自带架构（如 luci-app-airconnect_..._all.ipk、airconnect_..._aarch64_cortex-a53.ipk）
              cp "$f" "release_artifacts/$base"
            else
              # apk 文件名不带架构：
              # luci 界面包架构无关，直接拷贝；airconnect 二进制包加架构后缀
              if [[ "$base" == luci-app-airconnect* ]]; then
                cp "$f" "release_artifacts/$base"
              else
                cp "$f" "release_artifacts/${name}_${{ matrix.arch }}.${ext}"
              fi
            fi
          done
          echo "===== 收集到的包 ====="
          ls -la release_artifacts/

      - name: Upload packages
        uses: ncipollo/release-action@v1
        continue-on-error: true
        with:
          name: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: true
          prerelease: false
          artifacts: "release_artifacts/*.ipk,release_artifacts/*.apk"
          artifactErrorsFailBuild: false
